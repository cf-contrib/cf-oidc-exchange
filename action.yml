name: cloudflare-sts
description: Exchange a GitHub OIDC token for a short-lived Cloudflare API token and/or R2 credentials
author: cf-contrib
branding:
  icon: cloud
  color: orange
inputs:
  url:
    required: true
    description: Broker base URL, e.g. https://cloudflare-sts-api.example.com. Its origin is the OIDC audience, and must equal the GitHub provider's audience in the policy.
  profile:
    required: false
    description: Policy profile to request (not an AWS profile). Recommended when more than one profile could match.
  ttl:
    required: false
    description: Requested lifetime such as 10m or 1h, for the token and R2 credentials alike. Defaults to the profile's ttl, capped at its max_ttl.
runs:
  using: node24
  main: action/src/main.js
  post: action/src/post.js
