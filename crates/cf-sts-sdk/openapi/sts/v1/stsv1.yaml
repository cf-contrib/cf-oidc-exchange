openapi: 3.1.0
info:
  title: cf-sts
  description: |-
    Bodies are form-encoded, at most 16 KiB, and errors are OAuth errors (RFC 6749 §5.2),
    as RFC 8693 and RFC 7009 have it. Every response is `Cache-Control: no-store`, but
    the discovery endpoints' `200`s.

    Exchanges an OIDC token for short-lived Cloudflare credentials, or for an access token
    the broker signs for another service (RFC 8693 token exchange at `POST /oauth/token`;
    RFC 9068), and revokes Cloudflare tokens (RFC 7009 at `POST /oauth/revoke`). Services
    find the keys to verify the broker's tokens through its metadata (RFC 8414, or OpenID
    Connect Discovery for those that only read that).
  version: v1
tags:
  - name: DiscoveryService
    description: The broker's metadata and keys, public, for the services that verify its tokens.
  - name: TokenService
    description: 'Token exchange and revocation: the OAuth token and revocation endpoints.'
paths:
  /.well-known/jwks:
    get:
      operationId: jwks
      summary: The public key the broker signs its own tokens with.
      parameters: []
      responses:
        '200':
          description: A JWK Set. Empty when no signing key is bound. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - DiscoveryService
  /.well-known/oauth-authorization-server:
    get:
      operationId: metadata
      summary: The broker's Authorization Server Metadata (RFC 8414), with its keys and endpoints.
      description: Tokens come from exchange only, so there's no authorization endpoint.
      parameters: []
      responses:
        '200':
          description: The metadata. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - DiscoveryService
  /.well-known/openid-configuration:
    get:
      operationId: openidConfiguration
      summary: The broker's OpenID Provider Metadata (OpenID Connect Discovery 1.0), with its keys.
      description: |-
        For services that find an issuer's keys only through OpenID Connect Discovery, such
        as AWS IAM, Google Cloud Workload Identity Federation and Vault. The broker isn't a
        full OpenID Provider: tokens come from exchange only, so there's no authorization
        endpoint. As GitHub's and Kubernetes' issuers do, it publishes what verifying its
        tokens takes, and the members Discovery requires.
      parameters: []
      responses:
        '200':
          description: The metadata. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdProviderMetadata'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - DiscoveryService
  /oauth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke a Cloudflare API token the broker minted.
      description: |-
        Holding the token is the proof. Answers `200` whether the token was revoked, already
        gone, never valid, or not one the broker minted, which it never deletes: to the
        broker, that's an invalid token, which RFC 7009 §2.2 answers with `200` too.
      parameters: []
      responses:
        '200':
          description: Revoked, already gone, never valid, or not the broker's. No body.
        '400':
          description: |-
            The caller's mistake: the description says what was wrong. A request that doesn't fit
            this contract, such as a JSON body, is `invalid_request` too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloudflare or the subject token's issuer failed (`temporarily_unavailable`); the broker's logs say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - TokenService
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequest'
  /oauth/token:
    post:
      operationId: exchangeToken
      summary: Exchange an OIDC token for a Cloudflare API token and/or R2 credentials.
      description: |-
        The subject token is in the body, not an `Authorization` header. Which profile
        applies follows the policy: a named `profile` must match, otherwise exactly one
        profile must. Anything unsupported, such as `actor_token`, is refused rather than
        ignored. An invalid subject token, or one the policy doesn't take, is
        `invalid_request`, as RFC 8693 §2.2.2 has it; an `audience` the broker issues
        nothing for is `invalid_target`.
      parameters: []
      responses:
        '200':
          description: Issued. A profile with only a bucket returns no `access_token` and `token_type` `N_A`.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: |-
            The caller's mistake: the description says what was wrong. A request that doesn't fit
            this contract, such as a JSON body, is `invalid_request` too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloudflare or the subject token's issuer failed (`temporarily_unavailable`); the broker's logs say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - TokenService
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
components:
  schemas:
    AuthorizationServerMetadata:
      type: object
      required:
        - issuer
        - jwks_uri
        - token_endpoint
        - revocation_endpoint
        - response_types_supported
        - grant_types_supported
      properties:
        issuer:
          type: string
          description: Exactly the `iss` of the broker's tokens, so no trailing slash.
        jwks_uri:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
          description: Empty, since there's no authorization endpoint for a response type to be for.
        grant_types_supported:
          type: array
          items:
            type: string
          description: 'Token exchange only: `urn:ietf:params:oauth:grant-type:token-exchange`.'
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: "`none`: callers don't authenticate as clients; the subject token is the proof."
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: '`none`: holding the token is the proof.'
        login:
          $ref: '#/components/schemas/Login'
          description: |-
            The broker's own extension: where people sign in for a subject token, when the
            policy names a provider for it. Not secret.
      description: Authorization Server Metadata (RFC 8414 §2).
    BucketCredentials:
      type: object
      required:
        - name
        - access_key_id
        - secret_access_key
        - session_token
        - prefixes
        - endpoint
        - expires_on
      properties:
        name:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: Filled in from the caller's claims. Empty means the whole bucket.
        endpoint:
          type: string
          description: '`https://<account_id>.r2.cloudflarestorage.com`'
        expires_on:
          type: string
          format: date-time
      description: S3 credentials for the profile's R2 bucket, limited to `prefixes`. They can't be revoked; they expire.
    Error:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        error_description:
          type: string
          description: What went wrong.
      description: An OAuth error response (RFC 6749 §5.2).
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_target
        - unsupported_grant_type
        - server_error
        - temporarily_unavailable
      description: |-
        RFC 6749's error codes (§5.2, and §4.1.2.1 for the broker's own faults) and RFC
        8693's `invalid_target`.
    IssuedTokenType:
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:cf-sts:params:oauth:token-type:r2_credentials
        - urn:ietf:params:oauth:token-type:jwt
      description: |-
        What the exchange issues: a Cloudflare API token (`access_token`), R2 credentials
        alone (`r2_credentials`), or the broker's own JWT access token for a service
        (`access_token`, or `jwt` if asked for by that name).
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                enum:
                  - RSA
              'n':
                type: string
              e:
                type: string
              kid:
                type: string
              alg:
                type: string
                enum:
                  - RS256
              use:
                type: string
                enum:
                  - sig
            required:
              - kty
              - 'n'
              - e
              - kid
              - alg
              - use
      description: "A JWK Set (RFC 7517 §5): the broker's RSA public key, or none without a signing key."
    Login:
      type: object
      required:
        - issuer
        - client_id
      properties:
        issuer:
          type: string
          description: The provider's issuer. Its OpenID Connect Discovery document has the endpoints.
        client_id:
          type: string
          description: "The client to sign in as: the provider's `audience`, since an ID token's `aud` is its client ID."
      description: |-
        The OpenID Provider people sign in with, as a public client with PKCE, for an ID token
        the broker takes: the policy's `login` provider.
    OpenIdProviderMetadata:
      type: object
      required:
        - issuer
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          description: Exactly the `iss` of the broker's tokens, so no trailing slash.
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
          description: "`id_token`, as GitHub's and Kubernetes' issuers say, since Discovery requires one."
        subject_types_supported:
          type: array
          items:
            type: string
          description: "`public`: `sub` is the caller's `sub` from its issuer, the same for every service."
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: '`RS256`, what the broker signs its tokens with.'
      description: OpenID Provider Metadata (OpenID Connect Discovery 1.0 §3), without an authorization endpoint.
    TokenExchangeRequest:
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:token-exchange
        subject_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: An OIDC token from an issuer the policy names as a provider.
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:id_token
            - urn:ietf:params:oauth:token-type:jwt
          description: An OIDC token, as `id_token` or `jwt`.
        audience:
          type: string
          maxLength: 200
          description: |-
            `https://api.cloudflare.com` for Cloudflare credentials, or the URL of a service
            the policy issues the broker's own tokens for. Empty is `invalid_request`.
          default: https://api.cloudflare.com
        requested_token_type:
          $ref: '#/components/schemas/IssuedTokenType'
          description: |-
            Checked against the audience, not used to choose: what's issued is what the profile
            has. For Cloudflare's audience, `access_token` or `r2_credentials`; for a
            service's, `jwt` or `access_token`, two names for the same JWT. Any other is
            `invalid_target`.
        profile:
          type: string
          maxLength: 255
          description: Profile to use. If omitted, exactly one profile must match.
        ttl:
          type: string
          maxLength: 16
          description: |-
            Requested lifetime such as `10m` or `1h`, capped at the profile's `max_ttl`. If
            omitted, the profile's `ttl`. Below `1m`, or unparseable, is `invalid_request`.
    TokenExchangeResponse:
      type: object
      required:
        - issued_token_type
        - token_type
        - expires_in
        - expires_at
        - profile
      properties:
        access_token:
          type: string
          description: |-
            The Cloudflare API token, absent for a profile with only a bucket; or, for a
            service's audience, the JWT access token (RFC 9068, `typ` `at+jwt`) the broker
            signed.
        issued_token_type:
          $ref: '#/components/schemas/IssuedTokenType'
          description: '`access_token` with an `access_token`, `r2_credentials` without one, or `jwt` as asked for.'
        token_type:
          type: string
          enum:
            - Bearer
            - N_A
          description: '`Bearer` with an `access_token`, or `N_A` without one (RFC 8693 §2.2.1).'
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the token, or the R2 credentials, expire.
        expires_at:
          type: integer
          description: 'When the token, or the R2 credentials, expire: Unix time in seconds.'
        token_id:
          type: string
          description: The Cloudflare API token's ID, present with `access_token`.
        account_id:
          type: string
          description: The Cloudflare account, for the Cloudflare audience.
        profile:
          type: string
          description: The profile that allowed the exchange.
        bucket:
          $ref: '#/components/schemas/BucketCredentials'
          description: The R2 credentials, for a profile with a bucket.
    TokenRevocationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          description: The Cloudflare API token, as the exchange returned it in `access_token`.
        token_type_hint:
          type: string
          enum:
            - access_token
          description: 'If sent, `access_token`, and ignored: only Cloudflare API tokens the broker minted can be revoked.'
servers:
  - url: https://cf-sts.example.com
    variables: {}
