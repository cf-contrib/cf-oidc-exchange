[package]
name = "cloudflare-sts-cli"
version = "0.17.0" # x-release-please-version
edition = "2024"
authors = ["iamralch"]
readme = "README.md"
description = "cloudflare-sts for people: sign in, and run a command with short-lived Cloudflare credentials from the broker."

[[bin]]
name = "cloudflare-sts"
path = "src/main.rs"

[dependencies]
# Errors, with what led to them.
anyhow = "1"
# The broker's API: exchange, revocation and metadata, as the action uses them.
cloudflare-sts-sdk = { path = "../cloudflare-sts-sdk", features = ["client"] }

# The command line, with each setting's environment variable, and its colours.
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
# One thread: the exchange, the child, its signals, and the login's loopback.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }

# The login: OpenID Connect Discovery and the token endpoint, over the same
# TLS stack as the SDK.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
url = "2"
# PKCE (RFC 7636) and the state and nonce: random bytes, SHA-256, base64url.
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
# The browser the login opens.
open = "5"

# The ID token, in the OS keychain: Keychain on macOS, the Secret Service on
# Linux (over zbus, so no libdbus), Credential Manager on Windows.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

# The ID token's claims, the broker's responses, and `whoami --json`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Expiry, shown as RFC 3339 as the action and the broker show it.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
# Signals forwarded to the child.
libc = "0.2"

[dev-dependencies]
# The binary's tests, in tests/.
assert_cmd = "2"
predicates = "3"
# The stub broker and identity provider the tests run against.
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
